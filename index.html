<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>升学宴邀请函 · 安徽工业大学</title>
    <style>
        :root {
            --gold: #d4a843;
            --gold-light: #f0d68a;
            --gold-dark: #b8922e;
            --red: #a01f1f;
            --bg-cream: #fdf8f0;
            --text-dark: #3a2a1a;
            --text-gold: #c9a84c;
            --shadow-gold: 0 4px 20px rgba(212, 168, 67, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #2a0a0a 0%, #4a1010 30%, #6b1a1a 60%, #3a0d0d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 12px;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(212,168,67,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 60%, rgba(212,168,67,0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(212,168,67,0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .petals-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 1; overflow: hidden;
        }

        .petal {
            position: absolute; top: -30px; width: 14px; height: 14px;
            background: radial-gradient(circle at 30% 30%, #e8c87a, #d4a843, #b8922e);
            border-radius: 50%; opacity: 0.7;
            animation: fall linear infinite;
            clip-path: polygon(50% 0%, 80% 30%, 100% 60%, 80% 100%, 50% 85%, 20% 100%, 0% 60%, 20% 30%);
        }

        .petal:nth-child(1) { left: 5%; animation-duration: 12s; animation-delay: 0s; transform: scale(0.8); }
        .petal:nth-child(2) { left: 18%; animation-duration: 15s; animation-delay: 2s; transform: scale(1.1); }
        .petal:nth-child(3) { left: 32%; animation-duration: 11s; animation-delay: 4s; transform: scale(0.7); }
        .petal:nth-child(4) { left: 47%; animation-duration: 14s; animation-delay: 1s; transform: scale(0.9); }
        .petal:nth-child(5) { left: 58%; animation-duration: 13s; animation-delay: 3s; transform: scale(1.2); }
        .petal:nth-child(6) { left: 70%; animation-duration: 16s; animation-delay: 5s; transform: scale(0.85); }
        .petal:nth-child(7) { left: 80%; animation-duration: 12s; animation-delay: 2.5s; transform: scale(1.0); }
        .petal:nth-child(8) { left: 90%; animation-duration: 14s; animation-delay: 0.5s; transform: scale(0.75); }
        .petal:nth-child(9) { left: 12%; animation-duration: 17s; animation-delay: 6s; transform: scale(0.95); }
        .petal:nth-child(10) { left: 65%; animation-duration: 13s; animation-delay: 7s; transform: scale(0.65); }

        @keyframes fall {
            0% { top: -30px; transform: translateX(0) rotate(0deg) scale(1); opacity: 0.8; }
            25% { transform: translateX(30px) rotate(90deg) scale(1.05); opacity: 0.9; }
            50% { transform: translateX(-20px) rotate(180deg) scale(0.95); opacity: 0.85; }
            75% { transform: translateX(25px) rotate(270deg) scale(1.0); opacity: 0.9; }
            100% { top: 110vh; transform: translateX(-10px) rotate(360deg) scale(0.9); opacity: 0.6; }
        }

        .invitation-card {
            position: relative; z-index: 2;
            width: 100%; max-width: 420px;
            background: linear-gradient(180deg, #fefaf3 0%, #fdf6ea 30%, #faeed8 60%, #f8e8cd 100%);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 2px var(--gold-dark) inset, 0 0 0 4px rgba(212,168,67,0.3) inset;
            overflow: hidden;
            animation: cardAppear 1.2s ease-out;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-ornament {
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light), var(--gold), var(--gold-dark));
            height: 6px; width: 100%;
        }

        .card-inner-border {
            margin: 6px; border: 2px solid rgba(212,168,67,0.5); border-radius: 18px;
            padding: 4px; position: relative;
        }

        .card-inner-border::before {
            content: '';
            position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(212,168,67,0.25); border-radius: 14px; pointer-events: none;
        }

        .card-content {
            padding: 20px 24px 28px; text-align: center; position: relative;
        }

        .top-symbol {
            font-size: 28px; color: var(--gold); margin-bottom: 4px; letter-spacing: 8px;
            animation: shimmer 2.5s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,100% { opacity: 0.7; text-shadow: 0 0 8px rgba(212,168,67,0.4); }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(212,168,67,0.8); }
        }

        .main-title {
            font-size: 38px; font-weight: 900; color: var(--red); letter-spacing: 12px;
            margin: 6px 0 2px; font-family: 'STKaiti', 'KaiTi', '楷体', 'PingFang SC', serif;
            text-shadow: 0 2px 4px rgba(160,31,31,0.15); position: relative; display: inline-block;
        }

        .main-title::after {
            content: '';
            position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
            width: 70%; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .sub-title {
            font-size: 15px; color: var(--text-gold); letter-spacing: 6px; margin: 8px 0 4px; font-weight: 500;
        }

        .divider {
            display: flex; align-items: center; justify-content: center; margin: 12px 0; gap: 10px;
        }
        .divider .line { height: 1px; width: 60px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        .divider .diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 8px rgba(212,168,67,0.5); }

        .student-name {
            font-size: 40px; font-weight: 900; color: var(--red); letter-spacing: 4px;
            margin: 8px 0 4px; font-family: 'STKaiti', 'KaiTi', '楷体', 'PingFang SC', serif;
            text-shadow: 0 2px 6px rgba(160,31,31,0.2); animation: nameGlow 2s ease-in-out infinite;
        }

        @keyframes nameGlow {
            0%,100% { text-shadow: 0 2px 6px rgba(160,31,31,0.2); }
            50% { text-shadow: 0 2px 16px rgba(212,168,67,0.5); }
        }

        .school-info {
            margin: 8px 0 12px; padding: 14px 16px;
            background: linear-gradient(135deg, rgba(160,31,31,0.06), rgba(212,168,67,0.08));
            border-radius: 12px; border: 1px solid rgba(212,168,67,0.3);
        }

        .school-name {
            font-size: 22px; font-weight: 700; color: var(--red); letter-spacing: 2px; line-height: 1.5;
        }

        .blessing-line {
            font-size: 15px; color: var(--text-dark); letter-spacing: 1px; margin-top: 6px; opacity: 0.9;
        }

        .info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 10px;
        }

        .info-item {
            background: rgba(255,255,255,0.7); border-radius: 10px; padding: 12px 10px;
            border: 1px solid rgba(212,168,67,0.25); transition: all 0.3s ease; backdrop-filter: blur(4px);
        }

        .info-item:active { transform: scale(0.97); background: rgba(255,255,255,0.9); }
        .info-item .label {
            font-size: 12px; color: var(--text-gold); letter-spacing: 2px; margin-bottom: 6px;
            font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .info-item .value { font-size: 16px; font-weight: 700; color: var(--text-dark); letter-spacing: 1px; line-height: 1.4; }
        .info-item .value.highlight { color: var(--red); font-size: 18px; }

        .invitation-text {
            font-size: 14px; color: var(--text-dark); line-height: 2; letter-spacing: 1.5px;
            margin: 10px 0; opacity: 0.9; padding: 0 4px;
        }
        .invitation-text .highlight-text { color: var(--red); font-weight: 700; font-size: 15px; }

        .map-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #fff; border: none; border-radius: 50px; padding: 14px 28px;
            font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
            margin: 12px 0 6px; transition: all 0.3s ease; box-shadow: var(--shadow-gold);
            width: 100%; max-width: 280px; text-decoration: none; -webkit-tap-highlight-color: transparent;
            position: relative; overflow: hidden;
        }
        .map-btn::before {
            content: '';
            position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: btnShine 3s ease-in-out infinite;
        }
        @keyframes btnShine { 0% { left: -100%; } 50%,100% { left: 100%; } }
        .map-btn:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(212,168,67,0.3); }
        .map-btn .icon { font-size: 18px; }

        .footer {
            margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(212,168,67,0.3);
            font-size: 12px; color: var(--text-gold); letter-spacing: 2px; line-height: 1.8;
        }
        .footer .blessing { font-size: 14px; color: var(--red); font-weight: 700; letter-spacing: 3px; font-family: 'STKaiti','KaiTi','楷体',serif; }

        .bottom-ornament {
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light), var(--gold), var(--gold-dark));
            height: 6px; width: 100%;
        }

        .corner { position: absolute; width: 28px; height: 28px; border-color: var(--gold); border-style: solid; opacity: 0.6; pointer-events: none; }
        .corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
        .corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
        .corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

        /* 音乐按钮 */
        .music-toggle {
            position: fixed; top: 16px; right: 16px; z-index: 100;
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(145deg, #f0d68a, #d4a843);
            border: 2px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,0.3), 0 0 0 2px rgba(212,168,67,0.4);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #5a3010; transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent; user-select: none;
            animation: musicPulse 2s ease-in-out infinite;
        }
        .music-toggle.playing { animation: musicSpin 3s linear infinite, musicPulse 2s ease-in-out infinite; }
        @keyframes musicPulse {
            0%,100% { box-shadow: 0 6px 16px rgba(0,0,0,0.3), 0 0 0 2px rgba(212,168,67,0.4); }
            50% { box-shadow: 0 6px 24px rgba(212,168,67,0.7), 0 0 0 6px rgba(212,168,67,0.15); }
        }
        @keyframes musicSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .music-toggle:active { transform: scale(0.88); }

        @media (max-width: 380px) {
            .card-content { padding: 16px 16px 22px; }
            .main-title { font-size: 32px; letter-spacing: 8px; }
            .student-name { font-size: 32px; }
            .school-name { font-size: 18px; }
            .info-grid { gap: 6px; }
            .info-item { padding: 10px 8px; }
            .info-item .value { font-size: 14px; }
            .info-item .value.highlight { font-size: 15px; }
            .invitation-text { font-size: 13px; letter-spacing: 1px; }
            .map-btn { padding: 12px 20px; font-size: 14px; max-width: 240px; }
            .music-toggle { width: 42px; height: 42px; font-size: 18px; top: 12px; right: 12px; }
        }
        @media (min-width: 420px) {
            .card-content { padding: 24px 32px 32px; }
        }
    </style>
</head>
<body>

    <!-- 音乐文件：相对路径，与HTML文件放在同一文件夹下 -->
    <audio id="bgMusic" loop preload="auto" src="DQkasF-不再犹豫-BEYOND.mp3"></audio>

    <div class="music-toggle" id="musicToggle" role="button" aria-label="播放或暂停背景音乐" title="播放/暂停音乐">♪</div>

    <div class="petals-container">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>

    <div class="invitation-card">
        <div class="top-ornament"></div>
        <div class="card-inner-border">
            <div class="card-content">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>

                <div class="top-symbol">✦ ✦ ✦</div>
                <div class="main-title">升学宴</div>
                <div class="sub-title">— 金榜题名 · 鹏程万里 —</div>

                <div class="divider">
                    <div class="line"></div>
                    <div class="diamond"></div>
                    <div class="line"></div>
                </div>

                <!-- 学生姓名（请替换为真实姓名） -->
                <div class="student-name">赵徐奕</div>

                <!-- 学校信息：不显示具体专业 -->
                <div class="school-info">
                    <div class="school-name">🎓 安徽工业大学</div>
                    <div class="blessing-line">寒窗苦读十二载，今朝金榜题名时</div>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <div class="label">📅 宴会时间</div>
                        <div class="value highlight">8月22日<br>11:30</div>
                    </div>
                    <div class="info-item">
                        <div class="label">📍 宴会地点</div>
                        <div class="value">家味道土菜馆<br>龙潭北路店</div>
                    </div>
                </div>

                <div class="invitation-text">
                    谨定于<span class="highlight-text">2026年8月22日（周六）</span><br>
                    中午<span class="highlight-text">11:30</span> 于 <span class="highlight-text">家味道土菜馆(龙潭北路店)</span><br>
                    设宴庆贺，恭候您的光临！
                </div>

                <a class="map-btn" href="https://surl.amap.com/a5eV2aiR0DJ" target="_blank" rel="noopener">
                    <span class="icon">🗺️</span> 点击导航到餐厅
                </a>

                <div class="footer">
                    <div class="blessing">🎉 感恩有您 · 见证成长 🎉</div>
                    <div style="margin-top:4px;">— 赵徐奕及家人 敬邀 —</div>
                </div>
            </div>
        </div>
        <div class="bottom-ornament"></div>
    </div>

    <script>
        (function() {
            const bgMusic = document.getElementById('bgMusic');
            const musicToggle = document.getElementById('musicToggle');
            let isPlaying = false;
            let autoPlayAttempted = false;

            function updateButton() {
                if (isPlaying) {
                    musicToggle.classList.add('playing');
                    musicToggle.textContent = '♫';
                } else {
                    musicToggle.classList.remove('playing');
                    musicToggle.textContent = '♪';
                }
            }

            function tryPlay() {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    updateButton();
                }).catch(err => {
                    console.log('自动播放被阻止，等待用户交互。', err);
                    isPlaying = false;
                    updateButton();
                });
            }

            function togglePlay() {
                if (isPlaying) {
                    bgMusic.pause();
                    isPlaying = false;
                    updateButton();
                } else {
                    tryPlay();
                }
            }

            // 尝试自动播放（普通浏览器）
            window.addEventListener('load', () => {
                tryPlay();
                // 首次触摸屏幕时再次尝试（提高成功率）
                const autoPlayHandler = () => {
                    if (!isPlaying && !autoPlayAttempted) {
                        autoPlayAttempted = true;
                        tryPlay();
                        document.removeEventListener('touchstart', autoPlayHandler);
                        document.removeEventListener('click', autoPlayHandler);
                    }
                };
                document.addEventListener('touchstart', autoPlayHandler, { passive: true });
                document.addEventListener('click', autoPlayHandler);
            });

            // 微信内自动播放尝试：监听 WeixinJSBridgeReady 事件
            if (typeof WeixinJSBridge !== 'undefined') {
                WeixinJSBridge.invoke('getNetworkType', {}, function(e) {
                    // 桥接就绪后尝试播放
                    tryPlay();
                });
            } else {
                document.addEventListener('WeixinJSBridgeReady', function() {
                    tryPlay();
                }, false);
            }

            // 音乐按钮点击
            musicToggle.addEventListener('click', togglePlay);
            musicToggle.addEventListener('touchstart', function(e) {
                e.preventDefault();
                this.style.transform = 'scale(0.9)';
            }, { passive: false });
            musicToggle.addEventListener('touchend', function() {
                this.style.transform = '';
            }, { passive: true });

            bgMusic.addEventListener('play', () => { isPlaying = true; updateButton(); });
            bgMusic.addEventListener('pause', () => { isPlaying = false; updateButton(); });
            bgMusic.addEventListener('error', () => { console.warn('音乐文件加载失败，请检查路径'); });
        })();

        document.addEventListener('DOMContentLoaded', function() {
            const mapBtn = document.querySelector('.map-btn');
            if (mapBtn) {
                mapBtn.addEventListener('touchstart', function() { this.style.transform = 'scale(0.96)'; }, { passive: true });
                mapBtn.addEventListener('touchend', function() { this.style.transform = 'scale(1)'; }, { passive: true });
            }
            const infoItems = document.querySelectorAll('.info-item');
            infoItems.forEach(item => {
                item.addEventListener('touchstart', function() { this.style.transform = 'scale(0.97)'; }, { passive: true });
                item.addEventListener('touchend', function() { this.style.transform = 'scale(1)'; }, { passive: true });
            });
        });
    </script>
</body>
</html>
